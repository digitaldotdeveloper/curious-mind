<style>
.pl{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;
  background:#FFFBFE;transition:opacity .5s cubic-bezier(.22,1,.36,1),visibility .5s}
.pl-off{opacity:0;visibility:hidden;pointer-events:none}
.pl-in{display:flex;flex-direction:column;align-items:center;gap:16px;text-align:center;padding:24px}
.pl img{width:92px;height:auto}
.pl-name{font-family:Georgia,'Times New Roman',serif;font-size:21px;color:#312d3b}
.pl-slogan{margin-top:5px;font-size:10.5px;letter-spacing:.26em;text-transform:uppercase;color:#7A7D7D}
.pl-bar{width:170px;height:3px;border-radius:3px;background:rgba(151,133,185,.22);overflow:hidden}
.pl-fill{display:block;height:100%;width:100%;transform-origin:0 50%;transform:scaleX(0);
  background:linear-gradient(90deg,#9785B9,#F8BBD7);animation:plload 5s cubic-bezier(.15,.85,.25,1) forwards}
@keyframes plload{0%{transform:scaleX(.04)}55%{transform:scaleX(.72)}100%{transform:scaleX(.94)}}
.pl-done .pl-fill{animation:none;transform:scaleX(1);transition:transform .25s ease-out}
body.pl-lock{overflow:hidden}
@media (prefers-color-scheme:dark){
  .pl{background:#15131c}.pl-name{color:#f3effa}.pl-slogan{color:#8f8a9c}
}
@media (prefers-reduced-motion:reduce){.pl-fill{animation:none;transform:scaleX(.9)}}

<body class="reading pl-lock">
<div class="pl" id="cmload" role="status" aria-label="Loading Curious Mind">
  <div class="pl-in">
    <img src="assets/logo.webp" alt="" width="92" height="96" fetchpriority="high">
    <div>
      <div class="pl-name">Curious Mind</div>
      <div class="pl-slogan">Stories today. Ideas forever.</div>
    </div>
    <div class="pl-bar"><i class="pl-fill"></i></div>
  </div>
</div>
<script>
(function(){
  var box=document.getElementById('cmload'); if(!box) return;
  var done=false;
  function finish(){
    if(done) return; done=true;
    box.classList.add('pl-done');
    setTimeout(function(){
      box.classList.add('pl-off');
      document.body.classList.remove('pl-lock');
      setTimeout(function(){ if(box.parentNode) box.parentNode.removeChild(box); },600);
    },180);
  }
  window.CMload={finish:finish};
  var imgs=[].slice.call(document.images).filter(function(i){ return i.loading!=='lazy'; });
  var left=imgs.length+1;
  function tick(){ if(--left<=0) finish(); }
  imgs.forEach(function(i){
    if(i.complete && i.naturalWidth>0) return tick();
    i.addEventListener('load',tick,{once:true});
    i.addEventListener('error',tick,{once:true});
  });
  if(document.fonts&&document.fonts.ready) document.fonts.ready.then(tick)['catch'](tick); else tick();
  window.addEventListener('load',function(){ setTimeout(finish,60); });
  var since=(performance&&performance.now)?performance.now():0;
  setTimeout(finish, Math.max(600, 5000-since));   /* from navigation, so a slow
     start does not extend the wait — nothing may ever trap the reader */
})();
</script>
<noscript><style>.pl{display:none}body.pl-lock{overflow:auto}</style></noscript>

<span class="rprog" id="rprog" aria-hidden="true"></span>

    <button class="rtool" id="sepiaBtn" aria-pressed="false" aria-label="Sepia paper">
      <svg viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></button>

<main>
  <article class="chap" id="chap"></article>
  <div class="endcap" id="endcap"></div>
</main>

<script src="assets/data.js"></script>
<script src="assets/app.js"></script>
<script>
CM.boot(function(){
  var b=CM.book(CM.param("id"));
  var chap=CM.$("#chap"), endcap=CM.$("#endcap"), prog=CM.$("#rprog");

  if(!b){
    chap.innerHTML='<span class="kicker">Not found</span><h1>That chapter isn\'t here</h1>'+
      '<p>The book may have come off the shelf.</p>';
    endcap.innerHTML='<a class="btn btn-primary" href="shop.html">Browse the shelf</a>';
    return;
  }

  document.title = b.chapter.title.replace(/^One · /,"") + " — " + b.title + " — Curious Mind";
  CM.$("#backBtn").href="book.html?id="+b.id;
  CM.$("#rTitle").textContent=b.title;
  CM.$("#rMeta").textContent=b.author+" · "+b.cat;

  /* verse lines in poetry are marked with / and // in the source text */
  function para(t){ return '<p>'+CM.esc(t).replace(/\/\//g,"<br>").replace(/ \/ /g,"<br>")+'</p>'; }

  chap.innerHTML='<span class="kicker">'+(CM.owns(b.id)?"Your library":"Free preview")+'</span>'+
    '<h1>'+CM.esc(b.chapter.title).replace("·","<em>·</em>")+'</h1>'+
    b.chapter.paras.map(para).join("")+
    '<div class="rule"></div>';

  var owned=CM.owns(b.id);
  var idx=CATALOGUE.indexOf(b), nxt=CATALOGUE[(idx+1)%CATALOGUE.length];
  endcap.innerHTML='<p class="note">'+(owned?"End of chapter one.":"Chapter one ends here.")+'</p>'+
    '<div class="acts">'+
      (owned
        ? '<a class="btn btn-primary" href="library.html">Back to your library</a>'
        : (CM.inCart(b.id)
            ? '<a class="btn btn-primary" href="cart.html">In your bag — checkout</a>'
            : '<button class="btn btn-primary" data-add="'+b.id+'">Buy the full ebook — <span data-usd="'+b.price+'">'+CM.money(b.price)+'</span></button>')+
          '<a class="btn btn-ghost" href="book.html?id='+b.id+'">About this book</a>')+
    '</div>'+
    '<a class="nextlink" href="read.html?id='+nxt.id+'">Next on the shelf: '+CM.esc(nxt.title)+' &rarr;</a>';

  /* ---------- reading preferences ---------- */
  var FS=[16,18,20,23], fsIdx=CM.read("cm.fs",1);
  function applyFs(){ document.documentElement.style.setProperty("--fs",FS[fsIdx]+"px"); CM.write("cm.fs",fsIdx); }
  applyFs();
  CM.$("#fsUp").addEventListener("click",function(){ fsIdx=Math.min(FS.length-1,fsIdx+1); applyFs(); });
  CM.$("#fsDown").addEventListener("click",function(){ fsIdx=Math.max(0,fsIdx-1); applyFs(); });

  var sepiaOn=CM.read("cm.sepia",false), sBtn=CM.$("#sepiaBtn");
  function applySepia(){ document.body.classList.toggle("sepia",sepiaOn); sBtn.setAttribute("aria-pressed",sepiaOn?"true":"false"); CM.write("cm.sepia",sepiaOn); }
  applySepia();
  sBtn.addEventListener("click",function(){ sepiaOn=!sepiaOn; applySepia(); });

  /* ---------- progress: bar, save, restore ---------- */
  function docPct(){
    var max=document.documentElement.scrollHeight-innerHeight;
    return max>0 ? Math.min(100,Math.max(0,(scrollY/max)*100)) : 0;
  }
  var saveTimer=null;
  addEventListener("scroll",function(){
    var p=docPct();
    prog.style.width=p+"%";
    clearTimeout(saveTimer);
    saveTimer=setTimeout(function(){ CM.setProgress(b.id,p); },250);
  },{passive:true});

  var was=CM.progress(b.id);
  if(was>4 && was<97){
    setTimeout(function(){
      var max=document.documentElement.scrollHeight-innerHeight;
      scrollTo({top:max*(was/100), behavior:"auto"});
      CM.toast("Picked up where you left off — "+Math.round(was)+"%");
    },240);
  }
  prog.style.width=docPct()+"%";

  document.addEventListener("keydown",function(e){
    if(e.key==="Escape") location.href="book.html?id="+b.id;
  });
  document.addEventListener("cm:cart",function(){ location.reload(); });
});
</script>
