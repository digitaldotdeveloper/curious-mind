.pl{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;
  background:#FFFBFE;transition:opacity .5s cubic-bezier(.22,1,.36,1),visibility .5s}
.pl-off{opacity:0;visibility:hidden;pointer-events:none}
.pl-in{display:flex;flex-direction:column;align-items:center;gap:16px;text-align:center;padding:24px}
.pl img{width:92px;height:auto}

.pl-fill{display:block;height:100%;width:100%;transform-origin:0 50%;transform:scaleX(0);
  background:linear-gradient(90deg,#9785B9,#F8BBD7);animation:plload 5s cubic-bezier(.15,.85,.25,1) forwards}
@keyframes plload{0%{transform:scaleX(.04)}55%{transform:scaleX(.72)}100%{transform:scaleX(.94)}}
.pl-done .pl-fill{animation:none;transform:scaleX(1);transition:transform .25s ease-out}
body.pl-lock{overflow:hidden}
@media (prefers-color-scheme:dark){
  .pl{background:#15131c}.pl-name{color:#f3effa}.pl-slogan{color:#8f8a9c}
}

<script>
(function(){
  var box=document.getElementById('cmload'); if(!box) return;
  var done=false;
  function finish(){
    if(done) return; done=true;
    box.classList.add('pl-done');
    setTimeout(function(){
      box.classList.add('pl-off');
      document.body.classList.remove('pl-lock');
      setTimeout(function(){ if(box.parentNode) box.parentNode.removeChild(box); },600);
    },180);
  }
  window.CMload={finish:finish};
  var imgs=[].slice.call(document.images).filter(function(i){ return i.loading!=='lazy'; });
  var left=imgs.length+1;
  function tick(){ if(--left<=0) finish(); }
  imgs.forEach(function(i){
    if(i.complete && i.naturalWidth>0) return tick();
    i.addEventListener('load',tick,{once:true});
    i.addEventListener('error',tick,{once:true});
  });
  if(document.fonts&&document.fonts.ready) document.fonts.ready.then(tick)['catch'](tick); else tick();
  window.addEventListener('load',function(){ setTimeout(finish,60); });
  var since=(performance&&performance.now)?performance.now():0;
  setTimeout(finish, Math.max(600, 5000-since));   /* from navigation, so a slow
     start does not extend the wait — nothing may ever trap the reader */
})();
</script>

<script>
CM.boot(function(){
  var main=CM.$("#main");
  var b=CM.book(CM.param("id"));

  if(!b){
    main.innerHTML='<div class="pagehead"><h1>We can\'t find that book</h1>'+
      '<p>It may have come off the shelf — we only keep twelve at a time.</p></div>'+
      '<a class="btn btn-primary" href="shop.html">Browse the shelf</a>';
    return;
  }

  document.title = b.title + " — " + b.author + " — Curious Mind";
  var meta=document.querySelector('meta[name="description"]');
  if(meta) meta.setAttribute("content", b.blurb);

  function render(){
    var owned=CM.owns(b.id), inCart=CM.inCart(b.id);
    var ci=CM.countryInfo(CM.country());
    var vatLine = ci && ci.vat>0
      ? "Price excludes "+Math.round(ci.vat*1000)/10+"% VAT for "+ci.n+", added at checkout."
      : "No sales tax added for your region. Instant download, worldwide.";

    main.innerHTML =
    '<nav class="crumbs" aria-label="Breadcrumb"><a href="index.html">Home</a><span>/</span>'+
      '<a href="shop.html">The Shelf</a><span>/</span>'+
      '<a href="shop.html?cat='+encodeURIComponent(b.cat)+'">'+CM.esc(b.cat)+'</a><span>/</span>'+
      '<span aria-current="page">'+CM.esc(b.title)+'</span></nav>'+

    '<div class="bookgrid">'+
      '<div class="bcol reveal">'+CM.coverHTML(b)+
        '<div style="display:flex;gap:10px;margin-top:18px">'+
          '<button class="savebtn" data-save="'+b.id+'" aria-pressed="'+(CM.isSaved(b.id)?"true":"false")+'" aria-label="Save for later" style="width:44px;height:44px">'+CM.icon.heart+'</button>'+
          '<a class="btn btn-quiet btn-block" href="read.html?id='+b.id+'" style="flex:1">Read chapter one free</a>'+
        '</div>'+
      '</div>'+

      '<div class="detail reveal">'+
        '<span class="kicker">'+CM.esc(b.cat)+'</span>'+
        '<h1>'+CM.esc(b.title)+'</h1>'+
        '<p class="byline">by <b>'+CM.esc(b.author)+'</b></p>'+
        '<div class="metarow">'+CM.stars(b.rating)+
          '<span>'+b.rating.toFixed(1)+' · '+b.reviews+' readers</span><span>·</span>'+
          '<span>'+b.pages+' pages</span><span>·</span><span>'+b.year+'</span></div>'+

        '<div class="buybox">'+
          '<span class="pricetag" data-usd="'+b.price+'">'+CM.money(b.price)+'</span>'+
          (owned
            ? '<a class="btn btn-primary btn-lg" href="read.html?id='+b.id+'">Read it now</a>'+
              '<a class="btn btn-quiet" href="library.html">In your library</a>'
            : (inCart
              ? '<a class="btn btn-primary btn-lg" href="cart.html">In your bag — checkout</a>'
              : '<button class="btn btn-primary btn-lg" data-add="'+b.id+'">Add to bag</button>')+
              '<a class="btn btn-ghost" href="read.html?id='+b.id+'">Read chapter one</a>')+
          '<p class="vatnote">'+CM.esc(vatLine)+'</p>'+
        '</div>'+

        '<div class="trustrow" style="border:0;padding-top:6px;margin-bottom:26px">'+
          '<span><svg viewBox="0 0 24 24"><path d="M4 12.5l5 5L20 6.5"/></svg> DRM-free EPUB, PDF and MOBI — yours forever</span>'+
          '<span><svg viewBox="0 0 24 24"><path d="M4 12.5l5 5L20 6.5"/></svg> Instant download, delivered worldwide</span>'+
          '<span><svg viewBox="0 0 24 24"><path d="M4 12.5l5 5L20 6.5"/></svg> 14-day refund, no questions asked</span>'+
        '</div>'+

        '<div class="prose">'+b.about.map(function(p){ return '<p>'+CM.esc(p)+'</p>'; }).join("")+'</div>'+

        '<dl class="factgrid">'+
          '<div><dt>Format</dt><dd>EPUB · PDF · MOBI</dd></div>'+
          '<div><dt>Length</dt><dd>'+b.pages+' pages</dd></div>'+
          '<div><dt>Published</dt><dd>'+b.year+'</dd></div>'+
          '<div><dt>Language</dt><dd>English</dd></div>'+
          '<div><dt>Protection</dt><dd>None — DRM-free</dd></div>'+
          '<div><dt>Delivery</dt><dd>Instant, worldwide</dd></div>'+
        '</dl>'+

        '<h2 style="font-size:24px;font-weight:300;margin:34px 0 16px">What&rsquo;s inside</h2>'+
        '<ul class="toclist">'+b.contents.map(function(t,i){
          return '<li><i>'+String(i+1).padStart(2,"0")+'</i>'+CM.esc(t)+(i===0?' &nbsp;<a class="linky" href="read.html?id='+b.id+'">read free</a>':'')+'</li>';
        }).join("")+'</ul>'+
      '</div>'+
    '</div>'+

    '<section class="section"><div class="shead reveal"><div><h2>Also on the <em>shelf</em></h2>'+
      '<p>Chosen by the same person, in the same mood.</p></div>'+
      '<a class="btn btn-quiet" href="shop.html">See all twelve</a></div>'+
      '<div class="grid-books">'+related().map(CM.bookCard).join("")+'</div></section>';

    CM.reveal(main);
  }

  function related(){
    var same=CATALOGUE.filter(function(x){ return x.id!==b.id && x.cat===b.cat; });
    var rest=CATALOGUE.filter(function(x){ return x.id!==b.id && x.cat!==b.cat; })
      .sort(function(a,c){ return c.rating-a.rating; });
    return same.concat(rest).slice(0,4);
  }

  render();
  document.addEventListener("cm:cart",render);
  document.addEventListener("cm:currency",render);
});
</script>
